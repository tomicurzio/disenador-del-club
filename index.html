/* Layout: a darkroom bench. Form column on the left, the five pieces pinned up on the right. Single dark look that mirrors the club's posters. */
:root{
  --bg:#121211; --panel:#1b1b19; --line:#33332f; --ink:#ebe8df; --muted:#a29f95; --soft:#2a2a27;
  --accent:#d97575; --ok:#9fc79a; --warn:#e0b25a;
  --display:"Gilroy Club","Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Neue Montreal Club","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;letter-spacing:-.01em;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
header.top{max-width:1480px;margin:0 auto 20px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-family:var(--display);font-size:clamp(26px,3.2vw,40px);line-height:.95;margin:0;letter-spacing:0;text-transform:uppercase;font-weight:400}
header.top{padding-bottom:18px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:0;font-size:13px;max-width:60ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:0;display:grid;gap:0;min-width:0}
fieldset{padding:18px 20px!important;border-bottom:1px solid var(--line)!important}
fieldset:last-child{border-bottom:0!important}
@media (min-width:901px){.panel{position:sticky;top:max(16px,env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow:auto;scrollbar-width:none}.panel::-webkit-scrollbar{display:none}}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}
.legend{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;letter-spacing:.02em;text-transform:uppercase;color:var(--accent);margin:0 0 4px;background:var(--accent-bg,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;width:fit-content}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.rowTY{display:grid;grid-template-columns:1fr 92px;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1.4fr 1fr .8fr;gap:10px}
input,textarea,select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:0;padding:8px 10px;font:inherit;font-size:14px}
textarea{resize:vertical;min-height:84px}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=color]{padding:2px;height:36px}
input[type=range]{padding:0;accent-color:var(--accent)}
.hint{font-size:11.5px;color:var(--muted)}
button{font:inherit;font-weight:400;border-radius:0;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:9px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent-bg,var(--accent));border-color:transparent;color:#1a1a18;font-family:var(--display);text-transform:uppercase;font-size:16px;padding:12px 16px}
button:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.drop{border:1px dashed var(--line);border-radius:0;padding:10px;display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;cursor:pointer;min-width:0}
.drop.over{border-color:var(--accent)}
.drop img{width:72px;height:48px;object-fit:cover;border-radius:0;background:var(--soft)}
.drop b{display:block;color:var(--ink);font-size:13px}
.status{font-size:12px;color:var(--muted);min-height:1.2em}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.stills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:340px;overflow:auto;scrollbar-width:none}
.stills::-webkit-scrollbar{display:none}
.still{position:relative;display:block}
.still img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--soft)}
.still .pick{position:absolute;inset:auto 0 0 0;display:flex;gap:4px;padding:4px}
.still .pick button{flex:1;padding:4px 0;font-size:11px;background:rgba(18,18,17,.85)}
.still .pick button:hover{border-color:var(--accent)}
.pitchRow{display:grid;grid-template-columns:1fr 72px;gap:10px;align-items:center}
.pitchRow input[type=number]{padding:6px 8px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.fonts{display:grid;gap:8px}
.fontrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.pill.on{color:var(--ok);border-color:#4c6b49}
.board{display:grid;gap:14px;min-width:0;align-content:start}
@media (min-width:901px){.board{position:sticky;top:max(16px,env(safe-area-inset-top,0px))}}
@media (max-width:900px){.board{order:-1}}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar .title{display:flex;align-items:baseline;gap:10px;min-width:0}
.bar .title b{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:18px}
.bar .title span{color:var(--muted);font-size:13px}
.stage{background:#0b0b0a;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;padding:clamp(12px,3vw,32px);height:min(calc(100vh - 290px),900px);min-height:340px}
.stage canvas{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;min-height:0;min-width:0;display:block;box-shadow:0 12px 40px rgba(0,0,0,.6)}
@media (max-width:900px){
  body{padding-block:16px 32px}
  header.top{margin-bottom:14px}
  .wrap{gap:16px}
  .board{gap:10px}
  .bar .btns{width:100%;display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
  .bar .btns button{width:100%;padding:11px 8px;font-size:14px}
  .stage{height:auto;min-height:0;padding:14px}
  .stage canvas{max-height:62vh}
  .strip{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px!important;overflow:visible!important}
  .thumb{padding:4px!important;min-width:0;justify-items:center}
  .thumb{overflow:hidden;align-content:end}
  .thumb canvas{height:auto!important;width:auto!important;max-width:100%;max-height:84px}
  .thumb span{font-size:9px}
  #renderStatus:empty{display:none}
  fieldset{padding:16px!important}
}
@media (min-width:901px){
  html,body{height:100%;overflow:hidden}
  body{padding:16px!important;box-sizing:border-box}
  .wrap{height:100%;max-width:none}
  .panel{position:static!important;height:100%;max-height:none!important;overflow:auto}
  .board{position:static!important;height:100%;grid-template-rows:auto minmax(0,1fr) auto auto}
  .stage{height:auto!important;min-height:0!important;position:relative;padding:0!important}
  .stage canvas{position:absolute;inset:0;margin:auto;max-width:calc(100% - 48px);max-height:calc(100% - 48px)}
}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.thumb{flex:0 0 auto;display:grid;gap:6px;padding:6px;background:transparent;border:1px solid transparent;color:var(--muted);font-size:11px;text-align:left}
.thumb canvas{height:110px;width:auto;display:block}
.thumb span{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em}
.thumb[aria-pressed="true"]{border-color:var(--accent);color:var(--ink)}
.thumb:hover{border-color:var(--muted)}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* rounded UI (the pieces themselves stay square) */
.panel{border-radius:16px!important;overflow:hidden}
@media (min-width:901px){.panel{overflow:auto}}
input,textarea,select,button{border-radius:10px!important}
input[type=range]{border-radius:0!important}
.sw{border-radius:50%!important}
.drop{border-radius:12px!important}
.drop img{border-radius:6px!important}
.stage{border-radius:16px}
.thumb{border-radius:10px}
.still img{border-radius:8px}
.still .pick button{border-radius:6px!important}
</style>
</head>
<body>




<div class="wrap">
  <form class="panel" id="form" autocomplete="off">
    <fieldset aria-labelledby="lg1">
      <h2 class="legend" id="lg1">Película</h2>
      <div class="rowTY">
        <label>Título<input id="f_title" value="After Hours"></label>
        <label>Año<input id="f_year" value="1985" inputmode="numeric" maxlength="4" placeholder="Opcional"></label>
      </div>
      <div class="btns">
        <button type="button" id="draft">Completar con Claude</button>
        <span class="status" id="draftStatus"></span>
      </div>
      <label>Dirigida por<input id="f_dir" value="Martin Scorsese"></label>
      <label>Producida por<input id="f_prod" value="Amy Robinson, Griffin Dunne y Robert F. Colesberry"></label>
      <label>Escrita por<input id="f_writer" value="Joseph Minion"></label>
    </fieldset>

    <fieldset aria-labelledby="lg2">
      <h2 class="legend" id="lg2">Función</h2>
      <label>Lugar<input id="f_place" value="La General Pizzeria" list="places"></label>
      <div class="row">
        <label>Fecha<input id="f_date" type="date" value="2026-11-11"></label>
        <label>Hora<input id="f_hour" value="19.00"></label>
      </div>
      <datalist id="places"><option value="La General Pizzeria"><option value="AS4"></datalist>
    </fieldset>

    <fieldset aria-labelledby="lg3">
      <h2 class="legend" id="lg3">Sinopsis</h2>
      <label>Texto<textarea id="f_syn">Un oficinista sale una noche al SoHo para ver a una chica y queda atrapado en una cadena de desastres que no lo dejan volver a casa.</textarea></label>
      <label>Palabras resaltadas<input id="f_marks" value="una noche, atrapado, volver a casa"></label>
      <span class="hint">Separalas con comas. Tienen que aparecer tal cual en el texto.</span>
    </fieldset>

    <fieldset aria-labelledby="lg4">
      <h2 class="legend" id="lg4">Fotos</h2>
      <div class="btns" id="stillsBar" hidden>
        <button type="button" id="findStills">Buscar fotos</button>
        <span class="status" id="stillsStatus"></span>
      </div>
      <div class="stills" id="stills" hidden></div>
      <div class="drop" id="drop1" tabindex="0"><img id="th1" alt=""><div><b>Foto principal</b><span class="hint">Post, Historia 1 y A3. Tocá o arrastrá.</span></div></div>
      <label>Encuadre horizontal<input id="fx1" type="range" min="0" max="100" value="47"></label>
      <div class="drop" id="drop2" tabindex="0"><img id="th2" alt=""><div><b>Segunda foto</b><span class="hint">Historia 2. Tocá o arrastrá.</span></div></div>
      <label>Encuadre horizontal<input id="fx2" type="range" min="0" max="100" value="55"></label>
      <input type="file" id="file1" accept="image/*" hidden>
      <input type="file" id="file2" accept="image/*" hidden>
      <label>Tamaño de la trama<span class="pitchRow"><input id="pitchR" type="range" min="2" max="9" step="0.5" value="4.5" aria-label="Tamaño de la trama"><input id="pitch" type="number" min="1" max="30" step="0.1" value="4.5" inputmode="decimal" aria-label="Tamaño de la trama, número"></span></label>
    </fieldset>

    <fieldset aria-labelledby="lg5">
      <h2 class="legend" id="lg5">Estilo</h2>
      <div class="swatches" id="swatches" role="radiogroup" aria-label="Color del ciclo"></div>
      <label>Otro color<input id="f_acc" type="color" value="#d97575"></label>
      <input id="f_accKey" type="hidden" value="rosa">
    </fieldset>
  </form>

  <main class="board">
    <div class="bar">
      <div class="title"><b id="curName">Post</b><span id="curSize">1080×1350</span></div>
      <div class="btns">
        <button type="button" id="dlOne">Descargar esta</button>
        <button type="button" id="zipAll" class="primary">Descargar las 5 (.zip)</button>
      </div>
    </div>
    <div class="stage"><canvas id="big" aria-label="Vista previa"></canvas></div>
    <div class="strip" id="pieces" role="group" aria-label="Piezas"></div>
    <span class="status" id="renderStatus"></span>
  </main>
</div>

function accentOf(){const k=$("f_accKey").value;const a=ACCENTS.find(a=>a.key===k);return a?a.stops:[[0,$("f_acc").value]];}

/* ---------- data ---------- */
function data(){
  const d=$("f_date").value; let day="";
  if(d){const [y,m,dd]=d.split("-").map(Number);const dt=new Date(y,m-1,dd);day=`${DAYS[dt.getDay()]} ${dd}/${m}`;}
  return {title:$("f_title").value.trim(),year:$("f_year").value.trim(),dir:$("f_dir").value.trim(),prod:$("f_prod").value.trim(),
    writer:$("f_writer").value.trim(),place:$("f_place").value.trim(),day,hour:$("f_hour").value.trim(),
    syn:$("f_syn").value.trim(),marks:$("f_marks").value.split(",").map(s=>s.trim()).filter(Boolean),
    acc:accentOf(),fx1:+$("fx1").value/100,fx2:+$("fx2").value/100,pitch:Math.min(30,Math.max(1,+$("pitch").value||4.5))};
}
const slug=t=>t.toLowerCase().replace(/[\\/:*?"<>|]/g,"").trim()||"pieza";

/* ---------- halftone (same recipe as the Figma pieces) ---------- */
function halftone(img,W,H,fx,pitch){
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const s=Math.max(W/img.width,H/img.height),dw=img.width*s,dh=img.height*s;
  x.drawImage(img,(W-dw)*fx,(H-dh)/2,dw,dh);
  const id=x.getImageData(0,0,W,H),p=id.data,n=W*H,g=new Float32Array(n),hist=new Uint32Array(256);
  for(let i=0;i<n;i++){const v=(0.299*p[i*4]+0.587*p[i*4+1]+0.114*p[i*4+2])|0;g[i]=v;hist[v]++;}
  const pct=q=>{let a=0,t=q*n;for(let v=0;v<256;v++){a+=hist[v];if(a>=t)return v;}return 255;};
  const lo=pct(.01),hi=Math.max(lo+1,pct(.995));
  const sg=z=>1/(1+Math.exp(-5*(z-.5))),s0=sg(0),s1=sg(1);
  const a=Math.PI/4,ca=Math.cos(a)/pitch,sa=Math.sin(a)/pitch,TP=2*Math.PI;
  const D=[0x1d,0x1d,0x1b],L=[0xeb,0xe8,0xdf];
  for(let yy=0,i=0;yy<H;yy++)for(let xx=0;xx<W;xx++,i++){
    let v=(g[i]-lo)/(hi-lo);v=v<0?0:v>1?1:v;v=(sg(v)-s0)/(s1-s0);
    const u=xx*ca+yy*sa,w=-xx*sa+yy*ca;const spot=(Math.cos(TP*u)+Math.cos(TP*w))/4+.5;
    const t=.55*(v>1-spot?1:0)+.45*v,k=i*4;
    p[k]=D[0]+t*(L[0]-D[0]);p[k+1]=D[1]+t*(L[1]-D[1]);p[k+2]=D[2]+t*(L[2]-D[2]);p[k+3]=255;}
  x.putImageData(id,0,0);return c;
}
const htCache=new Map();
function photo(n,W,H,fx,pitch){
  const img=imgs[n];if(!img)return null;
  const key=[n,W,H,fx,pitch,img.src.length].join("|");
  if(!htCache.has(key)){if(htCache.size>24)htCache.clear();htCache.set(key,halftone(img,Math.round(W),Math.round(H),fx,pitch));}
  return htCache.get(key);
}

/* ---------- text helpers ---------- */
function capH(x,font){x.font=font;const m=x.measureText("H");return m.actualBoundingBoxAscent||parseFloat(font)*0.7;}
function fitTitle(x,text,maxFs,W,maxLines=2,room=Infinity){
  text=text.toUpperCase();
  x.font=`${maxFs}px ${TF}`;let w=x.measureText(text).width,fs=Math.min(maxFs,maxFs*W*0.98/w);
  if(fs>=maxFs*0.6||maxLines<2||!text.includes(" "))return{lines:[text],fs};
  const one=fs,capR=capH(x,`${maxFs}px ${TF}`)/maxFs;
  const words=text.split(" ");let best=null;
  for(let i=1;i<words.length;i++){const l=[words.slice(0,i).join(" "),words.slice(i).join(" ")];
    const lw=Math.max(...l.map(s=>x.measureText(s).width));if(!best||lw<best.lw)best={l,lw};}
  // two lines must fit in `room` (space above the last baseline) so the photo never shrinks
  const two=Math.min(maxFs,maxFs*W*0.98/best.lw,room/(capR*2.3));
  return two>one?{lines:best.l,fs:two}:{lines:[text],fs:one};
}
// draws title block so its last line's caps sit on `bottom`
function drawTitle(x,d,{maxFs,W,cx,left,bottom,align,room}){
  const {lines,fs}=fitTitle(x,d.title,maxFs,W,2,room);const f=`${fs}px ${TF}`;x.font=f;
  const ch=capH(x,f),step=lines.length>1?ch*1.3:fs*0.9;x.textAlign=align;x.textBaseline="alphabetic";
  lines.forEach((l,i)=>{const lw=x.measureText(l).width,lx=align==="center"?cx-lw/2:left;x.fillStyle=paint(x,d.acc,lx,lw);x.fillText(l,align==="center"?cx:left,bottom-(lines.length-1-i)*step);});
  return bottom-(lines.length-1)*step-ch;
}
// photo stays fixed; title, info row and credits stack below it with the Figma gaps (G1 title->info, G2 info->credits) and equal outer margins
function bottomStack(x,d,{top,H,cx,u,maxFs,W,credits,cFs,cW,cStep}){
  let G1=80*u,G2=47*u,Mmin=55*u;const iFs=45*u,iCap=capH(x,`${iFs}px ${BF}`),cFont=`${cFs}px ${BF}`,cCap=capH(x,cFont);
  const t=document.createElement("canvas").getContext("2d");const nl=Math.round((drawRich(t,credits,{font:cFont,top:0,W:cW,step:cStep,align:"center",cx})-0)/cStep);
  const C=cCap+(nl-1)*cStep,avail=H-top;
  // two-line titles use the tighter gaps of the two-line Figma pieces, so the title can stay big
  let room=avail-2*40*u-iCap-C-34*u-40*u;
  const {lines,fs}=fitTitle(x,d.title,maxFs,W,2,room);
  if(lines.length>1){G1=34*u;G2=40*u;}else room=avail-2*Mmin-iCap-C-G1-G2;const tCap=capH(x,`${fs}px ${TF}`);
  const T=tCap+(lines.length-1)*tCap*1.3;
  const M=(avail-T-iCap-C-G1-G2)/2;
  // one-line titles sit a little lower, closer to the info row
  const tBottom=top+M+T+(lines.length>1?0:20*u);
  drawTitle(x,d,{maxFs,W,cx,bottom:tBottom,room,align:"center"});
  const iTop=tBottom+G1-(lines.length>1?0:20*u);infoRow(x,d,{fs:iFs,cy:iTop+iCap/2,cx,gap:15*u});
  const cTop=iTop+iCap+G2;drawRich(x,credits,{font:cFont,top:cTop-(cStep-cCap)/2,W:cW,step:cStep,align:"center",cx});
}
function runs(text,marks){ // split text into [{t,mark}]
  const flags=new Array(text.length).fill(false);
  for(const m of marks){let i=text.indexOf(m);while(i>=0&&m){for(let k=i;k<i+m.length;k++)flags[k]=true;i=text.indexOf(m,i+m.length);}}
  const out=[];for(let i=0;i<text.length;i++){const l=out[out.length-1];if(l&&l.mark===flags[i])l.t+=text[i];else out.push({t:text[i],mark:flags[i]});}
  return out;
}
// rich wrapped text; segs: [{t, style}] style->fillStyle. returns bottom y
function drawRich(x,segs,{font,left,top,W,step,align="left",cx}){
  x.font=font;x.textBaseline="alphabetic";x.textAlign="left";
  const toks=[];for(const s of segs){for(const part of s.t.split(/(\s+)/)){if(part)toks.push({t:part,style:s.style,space:/^\s+$/.test(part)});}}
  const lines=[[]];let lw=0;
  for(const tk of toks){const w=x.measureText(tk.t).width;
    if(!tk.space&&lw+w>W&&lines[lines.length-1].some(z=>!z.space)){while(lines[lines.length-1].length&&lines[lines.length-1].at(-1).space)lines[lines.length-1].pop();lines.push([]);lw=0;}
    if(tk.space&&lw===0)continue;lines[lines.length-1].push({...tk,w});lw+=w;}
  const ch=capH(x,font);
  lines.forEach((ln,i)=>{while(ln.length&&ln.at(-1).space)ln.pop();const tw=ln.reduce((a,b)=>a+b.w,0);
    let xx=align==="center"?cx-tw/2:left;const base=top+i*step+(step+ch)/2;
    for(const tk of ln){x.fillStyle=Array.isArray(tk.style)?paint(x,tk.style,xx,tk.w):tk.style;x.fillText(tk.t,xx,base);xx+=tk.w;}});
  return top+lines.length*step;
}
function infoRow(x,d,{fs,cy,cx,gap}){
  const f=`${fs}px ${BF}`;x.font=f;const parts=[d.place,d.day,d.hour].filter(Boolean);
  const ws=parts.map(p=>x.measureText(p).width),tw=ws.reduce((a,b)=>a+b,0)+gap*(parts.length-1);
  let xx=cx-tw/2;const base=cy+capH(x,f)/2;x.fillStyle=LIGHT;x.textAlign="left";
  parts.forEach((p,i)=>{x.fillText(p,xx,base);xx+=ws[i]+gap;});
}
const dim=o=>`rgba(235,232,223,${o})`;
function shortCredits(d){return[{t:`${d.year} `,style:LIGHT},{t:"dirigida por ",style:dim(.5)},{t:d.dir,style:LIGHT}];}
function longCredits(d){
  const s=[{t:`${d.year} `,style:LIGHT},{t:"dirigida por ",style:dim(.6)},{t:d.dir.toUpperCase()+" ",style:LIGHT}];
  if(d.prod)s.push({t:"producida por ",style:dim(.6)},{t:d.prod.toUpperCase().replace(/ Y /g," y ")+" ",style:LIGHT});
  if(d.writer)s.push({t:"escrita por ",style:dim(.6)},{t:d.writer.toUpperCase(),style:LIGHT});
  return s;
}
function synSegs(d){return runs(d.syn,d.marks).map(r=>({t:r.t,style:r.mark?d.acc:LIGHT}));}
function imageBox(x,n,d,{x0,y0,w,h,fx,stroke,edge},scale){
  const ph=photo(n,w*scale,h*scale,fx,d.pitch*scale*(PIECE_SCALE_REF));
  if(ph)x.drawImage(ph,x0,y0,w,h);else{x.fillStyle="#3a3a36";x.fillRect(x0,y0,w,h);}
  x.fillStyle=LIGHT;if(edge==="bottom")x.fillRect(x0,y0+h-stroke,w,stroke);else x.fillRect(x0,y0,w,stroke);
}
let PIECE_SCALE_REF=1;

/* ---------- the five pieces (coordinates measured from the Figma file) ---------- */
const PIECES=[
 {key:"post",label:"Post",suffix:"",W:1080,H:1350,draw(x,d,s){
   PIECE_SCALE_REF=1;imageBox(x,1,d,{x0:0,y0:0,w:1080,h:950,fx:d.fx1,stroke:10,edge:"bottom"},s);
   bottomStack(x,d,{top:950,H:1350,cx:540,u:1,maxFs:135,W:982,credits:shortCredits(d),cFs:35,cW:900,cStep:42});}},
 {key:"sin",label:"Sinopsis",suffix:" sinopsis",W:1080,H:1350,draw(x,d){
   const f=`113px ${TF}`;x.font=f;x.fillStyle=paint(x,d.acc,50,x.measureText("SINÓPSIS").width);x.textAlign="left";x.fillText("SINÓPSIS",50,235.5+71.5+capH(x,f)/2);
   drawRich(x,synSegs(d),{font:`53px ${BF}`,left:50,top:390.5,W:980,step:64});}},
 {key:"h1",label:"Historia 1",suffix:" historia",W:1080,H:1920,draw(x,d,s){
   PIECE_SCALE_REF=1;imageBox(x,1,d,{x0:0,y0:0,w:1080,h:1525,fx:d.fx1,stroke:10,edge:"bottom"},s);
   bottomStack(x,d,{top:1525,H:1920,cx:540,u:1,maxFs:135,W:989,credits:shortCredits(d),cFs:35,cW:900,cStep:42});}},
 {key:"h2",label:"Historia 2",suffix:" historia 2",W:1080,H:1920,draw(x,d,s){
   PIECE_SCALE_REF=1;imageBox(x,2,d,{x0:0,y0:741,w:1080,h:1179,fx:d.fx2,stroke:10,edge:"top"},s);
   const top=drawTitle(x,d,{maxFs:123,W:900,left:91,bottom:352,align:"left"});
   let fs=53;const segs=synSegs(d);
   // shrink the synopsis if it would run into the photo
   for(;fs>36;fs-=2){const t=document.createElement("canvas").getContext("2d");const b=drawRich(t,segs,{font:`${fs}px ${BF}`,left:90,top:399,W:900,step:fs*1.21});if(b<=715)break;}
   drawRich(x,segs,{font:`${fs}px ${BF}`,left:90,top:399,W:900,step:fs*1.21});}},
 {key:"a3",label:"A3",suffix:" A3",W:3508,H:4961,draw(x,d,s){
   PIECE_SCALE_REF=3508/1080;imageBox(x,1,d,{x0:0,y0:0,w:3508,h:3483,fx:d.fx1,stroke:33,edge:"bottom"},s);
   bottomStack(x,d,{top:3483,H:4961,cx:1754,u:3508/1080,maxFs:520,W:3269,credits:longCredits(d),cFs:65,cW:3008,cStep:80});}},
];

function renderPiece(p,canvas,scale){
  const d=data();canvas.width=Math.round(p.W*scale);canvas.height=Math.round(p.H*scale);
  const x=canvas.getContext("2d");x.setTransform(scale,0,0,scale,0,0);x.fillStyle=BG;x.fillRect(0,0,p.W,p.H);
  p.draw(x,d,scale);return canvas;
}
const board=$("pieces");const cards={};let cur=PIECES[0];
for(const p of PIECES){
  const el=document.createElement("button");el.type="button";el.className="thumb";el.setAttribute("aria-pressed",p===cur);
  el.innerHTML=`<canvas aria-hidden="true"></canvas><span>${p.label}</span>`;
  board.appendChild(el);cards[p.key]={el,canvas:el.querySelector("canvas")};
  el.onclick=()=>{cur=p;for(const q of PIECES)cards[q.key].el.setAttribute("aria-pressed",q===cur);renderAll();};
}
$("dlOne").onclick=()=>downloadOne(cur);
let raf=0;
function renderAll(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
  for(const p of PIECES)renderPiece(p,cards[p.key].canvas,220/p.H);
  renderPiece(cur,$("big"),Math.min(1,1700/cur.H));
  $("curName").textContent=cur.label;$("curSize").textContent=`${cur.W}×${cur.H}`;
});}
const accentCss=st=>st.length===1?st[0][1]:`linear-gradient(90deg,${st.map(([p,c])=>c+" "+Math.round(p*100)+"%").join(",")})`;
const syncAccent=()=>{const st=accentOf(),r=document.documentElement.style;r.setProperty("--accent",st.length>2?st[0][1]:st[Math.floor(st.length/2)][1]);r.setProperty("--accent-bg",st.length===1?st[0][1]:accentCss(st.length===2?st:st));
  document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-checked",b.dataset.key===$("f_accKey").value));};
for(const a of ACCENTS){const b=document.createElement("button");b.type="button";b.className="sw";b.dataset.key=a.key;b.title=a.name;b.setAttribute("role","radio");b.setAttribute("aria-label",a.name);
  b.style.background=accentCss(a.stops);
  b.onclick=()=>{$("f_accKey").value=a.key;syncAccent();renderAll();saveDraft();};$("swatches").appendChild(b);}
$("f_acc").addEventListener("input",()=>{$("f_accKey").value="custom";});
// slider and number box move together; the number can go past the slider's range
$("pitchR").addEventListener("input",()=>{$("pitch").value=$("pitchR").value;});
$("pitch").addEventListener("input",()=>{const v=+$("pitch").value;if(v)$("pitchR").value=Math.min(9,Math.max(2,v));});
let deb=0;$("form").addEventListener("input",()=>{syncAccent();clearTimeout(deb);deb=setTimeout(()=>{renderAll();saveDraft();},120);});
$("form").addEventListener("submit",e=>e.preventDefault());

/* ---------- photos ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
/* ---------- stills from TMDB (only on the hosted site) ---------- */
$("findStills").onclick=async()=>{
  const st=$("stillsStatus"),box=$("stills"),title=$("f_title").value.trim(),year=$("f_year").value.trim();
  if(!title){st.className="status warn";st.textContent="Escribí el título primero.";return;}
  $("findStills").disabled=true;st.className="status";st.textContent="Buscando fotos…";
  try{
    const res=await fetch(`/api/fotos?title=${encodeURIComponent(title)}&year=${encodeURIComponent(year)}`);
    if(!res.ok)throw 0;const r=await res.json();
    if(r.notFound){st.className="status warn";st.textContent=year?`No encontré "${title}" de ${year}.`:`No encontré "${title}".`;box.hidden=true;return;}
    if(!r.stills.length){st.className="status warn";st.textContent="No hay fotos para esta película.";box.hidden=true;return;}
    st.className="status ok";st.textContent=`${r.title} (${r.year}): ${r.stills.length} fotos. Elegí 1 o 2 en cada una.`;
    box.innerHTML="";
    for(const f of r.stills){
      const el=document.createElement("div");el.className="still";
      el.innerHTML=`<img alt="" loading="lazy"><div class="pick"><button type="button" data-n="1">Principal</button><button type="button" data-n="2">Segunda</button></div>`;
      el.querySelector("img").src=f.thumb;
      el.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
        st.className="status";st.textContent="Cargando la foto en alta…";
        try{await setPhoto(+b.dataset.n,`/api/fotos?img=${encodeURIComponent(f.path)}`);st.className="status ok";st.textContent=b.dataset.n==="1"?"Foto principal lista.":"Segunda foto lista.";}
        catch(e){st.className="status warn";st.textContent="No se pudo cargar esa foto.";}
      });
      box.appendChild(el);
    }
    box.hidden=false;
  }catch(e){st.className="status warn";st.textContent="No se pudieron buscar fotos.";}
  finally{$("findStills").disabled=false;}
};
async function setPhoto(n,src){imgs[n]=await loadImg(src);$("th"+n).src=src;htCache.clear();renderAll();}
for(const n of [1,2]){
  const drop=$("drop"+n),file=$("file"+n);
  drop.onclick=()=>file.click();drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();file.click();}};
  file.onchange=()=>{const f=file.files[0];if(f)setPhoto(n,URL.createObjectURL(f));};
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over");};drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");const f=e.dataTransfer.files[0];if(f&&f.type.startsWith("image/"))setPhoto(n,URL.createObjectURL(f));};
}

/* ---------- export ---------- */
function fullPNG(p){return new Promise(res=>{const c=renderPiece(p,document.createElement("canvas"),1);c.toBlob(b=>res(b),"image/png");});}
let downloads=null;
async function save(filename,blob){
  if(!downloads){const u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download=filename;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);$("renderStatus").textContent=`Guardado: ${filename}`;$("renderStatus").className="status ok";return;}
  try{await downloads.save({filename,data:blob});$("renderStatus").textContent=`Guardado: ${filename}`;$("renderStatus").className="status ok";}
  catch(e){$("renderStatus").textContent=e&&e.code==="declined"?"Descarga cancelada.":`No se pudo descargar (${e&&e.code||"error"}).`;$("renderStatus").className="status warn";}
}
async function downloadOne(p){$("renderStatus").textContent=`Armando ${p.label} en alta…`;$("renderStatus").className="status";
  await new Promise(r=>setTimeout(r,30));const b=await fullPNG(p);await save(`${slug(data().title)}${p.suffix}.png`,b);}
$("zipAll").onclick=async()=>{
  const btn=$("zipAll");btn.disabled=true;$("renderStatus").className="status";
  try{const zip=new JSZip();const t=slug(data().title);
    for(const p of PIECES){$("renderStatus").textContent=`Armando ${p.label} en alta…`;await new Promise(r=>setTimeout(r,30));zip.file(`${t}${p.suffix}.png`,await fullPNG(p));}
    $("renderStatus").textContent="Comprimiendo…";const blob=await zip.generateAsync({type:"blob"});await save(`${t}.zip`,blob);}
  finally{btn.disabled=false;}
};

/* ---------- fonts: uploaded once, kept with the page ---------- */
let assets=null,db=null;
async function applyFont(kind,buf,name){
  const fam=kind==="title"?"ClubTitle":"ClubBody";
  const ff=new FontFace(fam,buf);await ff.load();document.fonts.add(ff);
  if(kind==="title"){TF=`"ClubTitle","Gilroy Club","Archivo Black"`;$("tName").textContent=name;}else{BF=`"ClubBody","Neue Montreal Club","Inter"`;$("bName").textContent=name;}
  htCache.clear();renderAll();
}
async function uploadFont(kind,file){
  const st=$("fontStatus");st.className="status";st.textContent="Cargando la tipografía…";
  try{await applyFont(kind,await file.arrayBuffer(),file.name.replace(/\.[^.]+$/,""));}
  catch(e){st.className="status warn";st.textContent="No pude leer ese archivo. Probá con .otf, .ttf o .woff.";return;}
  if(assets&&db){try{const r=await assets.upload(file);await db.doc("settings/fonts").set({...(fontDoc||{}),[kind]:{id:r.id,url:r.url,name:file.name.replace(/\.[^.]+$/,"")}});
      st.className="status ok";st.textContent="Guardada. La próxima vez ya va a estar cargada.";}
    catch(e){st.className="status warn";st.textContent="Se usa ahora, pero no se pudo guardar para la próxima.";}}
  else{st.className="status warn";st.textContent="Se usa en esta sesión. Para guardarla tenés que poder editar la página.";}
}
let fontDoc=null;

/* ---------- Claude fills in the film ---------- */
let sample=null;
$("draft").onclick=async()=>{
  const st=$("draftStatus");if(!sample){st.className="status warn";st.textContent="No disponible en esta vista.";return;}
  const title=$("f_title").value.trim();if(!title){st.className="status warn";st.textContent="Escribí el título primero.";return;}
  const year=$("f_year").value.trim();
  $("draft").disabled=true;st.className="status";st.textContent=year?`Buscando "${title}" de ${year}…`:"Buscando datos…";
  try{
    const r=await sample.json(`Sos el equipo de comunicación de un cine club universitario de Buenos Aires. Para la película "${title}"${year?` estrenada en ${year}. Tiene que ser exactamente la de ese año: puede haber otras con el mismo título de otros años, ignoralas. Si no existe una película con ese título estrenada en ${year}, devolvé solo {"notFound":true}`:""}. Devolvé SOLO un objeto JSON con estas claves:
"year": año de estreno (string),
"director": nombre completo del director/a,
"producers": productor/es principales separados por " y " (string, vacío si no lo sabés con certeza),
"writer": guionista/s separados por " y ",
"synopsis": una sola oración en español rioplatense neutro, de 110 a 160 caracteres, sin spoilers del final, que presente la premisa,
"highlights": array con exactamente 3 frases cortas (1 a 3 palabras) copiadas TEXTUALMENTE de la sinopsis, las más evocadoras.
No inventes créditos: si dudás, dejá el campo vacío.`,{modelTier:"default"});
    if(r.notFound){st.className="status warn";st.textContent=`No encontré "${title}" de ${year}. Revisá el año o borralo.`;return;}
    if(r.year&&!year)$("f_year").value=r.year; if(r.director)$("f_dir").value=r.director;
    $("f_prod").value=r.producers||""; if(r.writer)$("f_writer").value=r.writer;
    if(r.synopsis)$("f_syn").value=r.synopsis; if(Array.isArray(r.highlights))$("f_marks").value=r.highlights.join(", ");
    st.className="status ok";st.textContent="Listo. Revisá los créditos antes de exportar.";renderAll();saveDraft();
  }catch(e){st.className="status warn";st.textContent=e&&e.code==="rate_limited"?"Demasiados pedidos, probá en un rato.":"No se pudo completar. Cargalo a mano.";}
  finally{$("draft").disabled=false;}
};

/* ---------- remember the last film in this browser ---------- */
const FIELDS=["f_title","f_year","f_dir","f_prod","f_writer","f_place","f_date","f_hour","f_syn","f_marks","f_acc","f_accKey","fx1","fx2","pitch"];
function saveDraft(){try{localStorage.setItem("taller-draft-2",JSON.stringify(Object.fromEntries(FIELDS.map(f=>[f,$(f).value]))));}catch(e){}}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem("taller-draft-2")||"null");if(d){FIELDS.forEach(f=>{if(d[f]!=null)$(f).value=d[f];});return true;}}catch(e){}return false;}

/* ---------- boot ---------- */
(async()=>{
  const hadDraft=loadDraft();{const v=+$("pitch").value;if(v)$("pitchR").value=Math.min(9,Math.max(2,v));}syncAccent();
  try{await Promise.all([document.fonts.load(`40px "Gilroy Club"`),document.fonts.load(`40px "Neue Montreal Club"`),document.fonts.load(`40px "Archivo Black"`),document.fonts.load(`40px "Inter"`)]);}catch(e){}
  imgs[1]=await loadImg(SAMPLE1);imgs[2]=await loadImg(SAMPLE2);$("th1").src=SAMPLE1;$("th2").src=SAMPLE2;
  renderAll();
  const c=window.claude;if(!c||!c.use){
    // Vercel: the button calls our own function, which talks to Claude with the club's API key
    $("stillsBar").hidden=false;
    // first visit: bring real After Hours stills so the default film matches its photos
    if(!hadDraft)fetch("/api/fotos?title=After%20Hours&year=1985").then(r=>r.ok?r.json():null).then(async r=>{
      const st=r&&r.stills||[];if(st.length<2)return;const s2=st[2]||st[0];
      try{await setPhoto(1,`/api/fotos?img=${encodeURIComponent(st[1].path)}`);await setPhoto(2,`/api/fotos?img=${encodeURIComponent(s2.path)}`);}catch(e){}
    }).catch(()=>{});
    sample={json:async()=>{const res=await fetch("/api/completar",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({title:$("f_title").value.trim(),year:$("f_year").value.trim()})});
      if(res.status===429)throw{code:"rate_limited"};if(!res.ok)throw{code:"error"};return res.json();}};
    return;}
  c.use("downloads").then(d=>{downloads=d;if(!d)$("zipAll").title="Descargas no disponibles en esta vista";});
  c.use("sample").then(s=>{sample=s;if(!s)$("draft").hidden=true;});
})();
</script>
